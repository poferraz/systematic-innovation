name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out tagged revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Run repository isolation, authority, and unit tests
        run: |
          python3 -m tools.repository validate
          python3 -m unittest discover -s tests -v

      - name: Build canonical skill distribution twice in independent directories
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          REVISION="$(git rev-parse HEAD)"
          mkdir -p "${RUNNER_TEMP}/build-a" "${RUNNER_TEMP}/build-b"
          python3 -m tools.repository package \
            --source skills/systematic-innovation \
            --output "${RUNNER_TEMP}/build-a/systematic-innovation.zip" \
            --manifest "${RUNNER_TEMP}/build-a/systematic-innovation.manifest.json" \
            --version "${VERSION}" \
            --revision "${REVISION}"
          python3 -m tools.repository package \
            --source skills/systematic-innovation \
            --output "${RUNNER_TEMP}/build-b/systematic-innovation.zip" \
            --manifest "${RUNNER_TEMP}/build-b/systematic-innovation.manifest.json" \
            --version "${VERSION}" \
            --revision "${REVISION}"
          cmp -s "${RUNNER_TEMP}/build-a/systematic-innovation.zip" "${RUNNER_TEMP}/build-b/systematic-innovation.zip"
          cmp -s "${RUNNER_TEMP}/build-a/systematic-innovation.manifest.json" "${RUNNER_TEMP}/build-b/systematic-innovation.manifest.json"
          (cd "${RUNNER_TEMP}/build-a" && shasum -a 256 systematic-innovation.zip > systematic-innovation.zip.sha256)

      - name: Verify artifact manifest, revocations, and post-extraction install smoke test
        run: |
          python3 -m tools.repository verify-artifact \
            "${RUNNER_TEMP}/build-a/systematic-innovation.zip" \
            --manifest "${RUNNER_TEMP}/build-a/systematic-innovation.manifest.json" \
            --source skills/systematic-innovation \
            --revocations release/revocations.json \
            --policy release/policy.json

      - name: Attest reproducible release artifact
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26
        with:
          subject-path: ${{ runner.temp }}/build-a/systematic-innovation.zip

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "${RUNNER_TEMP}/build-a/systematic-innovation.zip" \
            "${RUNNER_TEMP}/build-a/systematic-innovation.manifest.json" \
            "${RUNNER_TEMP}/build-a/systematic-innovation.zip.sha256" \
            --title "${GITHUB_REF_NAME}" \
            --verify-tag \
            --generate-notes
