name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Validate canonical skill
        run: python3 tools/validate_skill.py skills/systematic-innovation
      - name: Run authority checks
        run: python3 -m tools.repository.authority
      - name: Run repository isolation and validation checks
        run: python3 -m tools.repository validate
      - name: Run repository-shell architecture acceptance check
        run: python3 -m tools.repository acceptance --evidence evidence/architecture/acceptance.json --stage repository-shell
