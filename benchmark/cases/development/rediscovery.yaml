cases:
- id: red-dev-001
  family: counterfactual-rediscovery
  domain: logistics
  split: development
  prompt: A merchant moves delicate goods across a sea and then through several inland depots.
    Most damage occurs when handlers move individual parcels between vehicles, although every
    carrier follows its own rules. Explore conceptual alternatives that reduce damage without
    requiring one company to own the entire journey.
  strata:
    mode: deep
    ambiguity: high
    constraint_severity: hard
    stakeholder_complexity: multiple
    solution_space: open
    opportunity_type: systemic
    domain_knowledge: general
    preservation: hard
    stakeholder_conflict: present
  expected_mode: deep
  should_trigger: true
  interaction_mode: controlled-multi-turn
  conversation_script:
    user_turns:
    - Dock workers need safe handling and smaller merchants must retain affordable access. Individual
      parcels must remain identifiable and inspectable when required.
    - Carriers can agree new handling arrangements, but ports have different equipment and no
      participant can rebuild every depot at once. Please produce the final portfolio now.
