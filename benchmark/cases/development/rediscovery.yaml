- id: red-dev-006
  family: counterfactual-rediscovery
  domain: food-systems
  split: development
  prompt: A food producer must keep prepared goods usable during long journeys without adding
    ingredients customers cannot tolerate. Heating the whole storage area would damage packaging,
    and journeys vary in length. Explore conceptual preservation possibilities without claiming
    an untested process is safe or replacing required food-safety validation.
  strata:
    mode: quick
    ambiguity: bounded
