- id: red-dev-003
  family: counterfactual-rediscovery
  domain: public-services
  split: development
  prompt: A town must help strangers identify the correct street without relying on spoken directions.
    Several streets have similar-looking entrances and many residents cannot read the same language.
    Explore ways to reduce mistaken journeys while retaining access for people with impaired vision
    and keeping civic information trustworthy.
  strata:
