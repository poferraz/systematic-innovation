  interaction_mode: single-turn
- id: red-dev-009
  family: counterfactual-rediscovery
  domain: research
  split: development
  prompt: Investigators need to compare observations made at distant sites, but each site records
    time according to its own local practice. Disagreements appear to be scientific differences
    when they may be recording differences. Explore ways to make comparisons trustworthy without
    requiring every site to replace its instruments.
  strata:
    mode: deep
    ambiguity: high
    constraint_severity: hard
    stakeholder_complexity: multiple
    solution_space: open
    opportunity_type: systemic
    domain_knowledge: general
    preservation: hard
    stakeholder_conflict: present
  expected_mode: deep
  should_trigger: true
  interaction_mode: controlled-multi-turn
  conversation_script:
    user_turns:
    - Sites want to keep useful historical records, and smaller teams cannot fund replacement
      equipment. Original observations and uncertainty must remain visible.
    - A coordinating body can agree reporting conventions and provide shared reference material.
      It cannot revisit past events or force identical local working hours. Please produce the
      final portfolio now.
