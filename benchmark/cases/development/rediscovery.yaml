- id: red-dev-004
  family: counterfactual-rediscovery
  domain: software
  split: development
  prompt: A service sends the same large reference material to many distant offices. Offices need
    fast access, but repeated requests overload the central connection. The material changes occasionally
    and stale versions can cause errors. Explore alternatives that improve availability without
    letting offices unknowingly rely on outdated material.
  strata:
    mode: deep
    ambiguity: high
    constraint_severity: hard
    stakeholder_complexity: multiple
    solution_space: open
    opportunity_type: systemic
    domain_knowledge: general
    preservation: hard
    stakeholder_conflict: present
  expected_mode: deep
  should_trigger: true
  interaction_mode: controlled-multi-turn
  conversation_script:
    user_turns:
    - Central editors need reliable corrections, while local staff must work during short connection
      outages. Access restrictions and an auditable version history must remain intact.
    - The organization controls its own computers and publication rules, but cannot upgrade the
      connection this year or assume all offices reconnect at the same time. Please produce the
      final portfolio now.
