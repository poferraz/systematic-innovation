- id: red-dev-007
  family: counterfactual-rediscovery
  domain: transport
  split: development
  prompt: A city has crowded junctions where different travelers cannot predict when others will
    move. Street workers currently direct traffic in person, but staffing every junction is impractical.
    Explore alternatives that make crossings dependable without assuming that all travelers can
    hear, see colors, or move quickly.
  strata:
    mode: deep
    ambiguity: high
    constraint_severity: hard
    stakeholder_complexity: multiple
    solution_space: open
    opportunity_type: systemic
    domain_knowledge: general
    preservation: hard
    stakeholder_conflict: present
  expected_mode: deep
  should_trigger: true
  interaction_mode: controlled-multi-turn
  conversation_script:
    user_turns:
    - Pedestrians fear being stranded and delivery drivers fear repeated delays. Emergency access
      and safe crossing time for slower travelers must be preserved.
    - The city controls street equipment and operating rules. It cannot widen roads, remove pedestrian
      access, or put a worker at every crossing. Please produce the final portfolio now.
