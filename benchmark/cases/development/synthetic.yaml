- id: syn-dev-003
  family: synthetic-mechanism
  domain: software
  split: development
  prompt: A simulation team produces map updates using two computers and one reviewer. Updates
    sometimes wait a long time despite low computer use. No unreviewed map may be published, and
    the team cannot hire. Explore possibilities for faster dependable publication without increasing
    the reviewer's total hours.
  strata:
    mode: deep
    ambiguity: high
    constraint_severity: hard
    stakeholder_complexity: multiple
    solution_space: open
    opportunity_type: systemic
    domain_knowledge: general
    preservation: hard
    stakeholder_conflict: present
  expected_mode: deep
  should_trigger: true
  interaction_mode: controlled-multi-turn
  conversation_script:
    user_turns:
    - Authors want quick publication while the reviewer needs uninterrupted time. The existing
