cases:
- id: syn-dev-001
  family: synthetic-mechanism
  domain: logistics
  split: development
  prompt: In a fictional depot, twelve carts carry sealed boxes through three rooms. Every box
    must pass a weight check, but some arrive at the loading door too late even on quiet days.
    Workers cannot open boxes or add carts. Explore different ways the depot might deliver more
    boxes on time without weakening the check.
  strata:
    mode: deep
    ambiguity: high
    constraint_severity: hard
    stakeholder_complexity: multiple
    solution_space: open
    opportunity_type: systemic
    domain_knowledge: general
    preservation: hard
    stakeholder_conflict: present
  expected_mode: deep
  should_trigger: true
  interaction_mode: controlled-multi-turn
  conversation_script:
    user_turns:
    - Loaders are blamed for lateness while checkers are rewarded for catching errors. Both groups
      must keep their current rest breaks, and all boxes must remain traceable.
    - The depot controls cart routes and room schedules but cannot alter arrival times or expand
      the building. There is one supervisor and no equipment budget. Please produce the final
      portfolio now.
