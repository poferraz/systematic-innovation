- id: sys-dev-011
  family: open-ended-systemic
  domain: healthcare-operations
  split: development
  prompt: A clinic's missed non-urgent visits frustrate patients and staff, but penalties would
    harm people with unstable work or transport. Appointment slots are limited and reception staff
    already handle heavy calls. Explore conceptual service alternatives that improve dependable
    access while preserving confidentiality and clinical priority; do not provide clinical instructions.
  strata:
    mode: deep
    ambiguity: high
    constraint_severity: hard
    stakeholder_complexity: multiple
    solution_space: open
    opportunity_type: systemic
    domain_knowledge: general
    preservation: hard
    stakeholder_conflict: present
  expected_mode: deep
  should_trigger: true
  interaction_mode: controlled-multi-turn
  conversation_script:
    user_turns:
    - Staff need manageable workloads and patients need a fair chance to explain barriers. No
      one may lose urgent care or be labeled unreliable without review.
    - The clinic controls scheduling practices and patient communications but not transport services
      or clinical staffing. There is no budget for a new system. Please produce the final portfolio
      now.
