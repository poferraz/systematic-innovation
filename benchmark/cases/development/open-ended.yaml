- id: sys-dev-013
  family: open-ended-systemic
  domain: research
  split: development
  prompt: A university laboratory has valuable failed experiments that new students rarely find.
    Supervisors value publishable successes, students fear looking incompetent, and repeated mistakes
    waste scarce materials. Explore possibilities that improve shared learning while preserving
    honest records, appropriate confidentiality, and credit for the people who produced useful
    negative findings.
  strata:
    mode: deep
    ambiguity: high
    constraint_severity: hard
    stakeholder_complexity: multiple
    solution_space: open
    opportunity_type: systemic
    domain_knowledge: general
    preservation: hard
    stakeholder_conflict: present
  expected_mode: deep
  should_trigger: true
  interaction_mode: controlled-multi-turn
  conversation_script:
    user_turns:
    - Early-career researchers worry that disclosure will damage careers, and collaborators have
      contractual confidentiality needs. No one may be compelled to expose private participant
      data.
    - The laboratory controls local records and supervision routines but cannot change journal
      incentives or funder contracts. It can use existing storage and seminar time. Please produce
      the final portfolio now.
